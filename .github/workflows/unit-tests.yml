name: Unit Tests (MNIST Output Check)

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential make libffi-dev

      - name: Build and run MNIST
        run: |
          make
          cd examples/MNIST
          make run > output.txt

      - name: Check output for expected result
        run: |
          if grep -q "Spiking Neurons" examples/MNIST/output.txt; then
            echo "Test passed: Expected output found."
          else
            echo "Test failed: Expected output not found."
            exit 1
          fi

