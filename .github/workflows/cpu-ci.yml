name: CPU CI Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential make libffi-dev

      - name: Build GeNN
        run: make

      - name: Run MNIST Example
        run: |
          cd examples/MNIST
          make run

