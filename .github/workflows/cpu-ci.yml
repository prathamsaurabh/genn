name: CPU CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential make

    - name: Build GeNN
      run: |
        make

    - name: Run MNIST Example
      run: |
        cd examples/MNIST
        make run

